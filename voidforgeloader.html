<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08080c">

  <title>Loading — Void Forge Studios</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #08080c;
    }

    .loader {
      position: fixed;
      inset: 0;
      z-index: 10;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at center,
          rgba(255, 255, 255, 0.05),
          transparent 30%
        ),
        #08080c;

      color: white;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      transition:
        opacity 0.5s ease,
        visibility 0.5s ease;
    }

    .loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .spinner {
      width: 52px;
      height: 52px;

      border: 2px solid rgba(255, 255, 255, 0.12);
      border-top-color: white;
      border-right-color: rgba(255, 255, 255, 0.5);

      border-radius: 50%;

      animation: spin 0.85s linear infinite;
    }

    .text {
      margin-top: 20px;

      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.32em;

      color: rgba(255, 255, 255, 0.6);
    }

    .site-frame {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      border: 0;
      display: block;

      background: #08080c;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner {
        animation: none;
      }
    }
  </style>
</head>

<body>

  <!-- Loading screen -->
  <div class="loader" id="loader">
    <div class="spinner" aria-hidden="true"></div>
    <div class="text">LOADING</div>
  </div>

  <!-- Starts as about:blank -->
  <iframe
    id="siteFrame"
    class="site-frame"
    src="about:blank"
    title="Void Forge Studios"
    loading="eager"
    allowfullscreen
  ></iframe>

  <script>
    (() => {
      const frame = document.getElementById("siteFrame");
      const loader = document.getElementById("loader");

      const TARGET =
        "https://voidforgestudios272.github.io";

      const DELAY = 2000;

      // Keep iframe at about:blank initially.
      // After 2 seconds, load the site inside it.
      setTimeout(() => {
        frame.src = TARGET;
      }, DELAY);

      // Hide the loader once the iframe finishes loading.
      frame.addEventListener("load", () => {
        if (frame.src !== "about:blank") {
          loader.classList.add("hidden");
        }
      });
    })();
  </script>

</body>
</html>
