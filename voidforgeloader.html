<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading...</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .loader {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0b0b0f;
      color: white;
      font-family: Arial, sans-serif;
    }

    .spinner {
      width: 45px;
      height: 45px;
      border: 3px solid rgba(255,255,255,.15);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    .text {
      margin-top: 18px;
      font-size: 13px;
      letter-spacing: 3px;
      opacity: .7;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <div class="loader">
    <div class="spinner"></div>
    <div class="text">LOADING</div>
  </div>

  <script>
    // Wait 2 seconds, then load the new site
    setTimeout(() => {
      window.location.href = "https://voidforgestudios272.github.io";
    }, 2000);
  </script>

</body>
</html>
